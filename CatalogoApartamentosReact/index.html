<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Consulta residenciales y apartamentos en República Dominicana." />
    <title>Catálogo de Apartamentos</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" />
    <script>
      // Aplica el tema guardado antes de que cargue React para evitar un destello de colores.
      try {
        const guardado = JSON.parse(localStorage.getItem('catalogo:tema'))
        document.documentElement.dataset.theme = guardado || (matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro')
      } catch {
        document.documentElement.dataset.theme = 'claro'
      }
    </script>
  </head>
  <body>
    <!-- Punto de montaje de React. -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
